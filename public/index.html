<html>

<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <script defer src="login.js"></script>
</head>



<body>

<main id="main-holder">
    <h1 id="login-header">Login</h1>

    <div id="login-error-msg-holder">
        <p id="login-error-msg">invalid username <span id="error-msg-second-line">and/or password</span></p>
    </div>

    <form id="login-form"></form>>
        <input type="text" name="username" placeholder="Username" required class="login-form-field" required>
        <input type="password" name="password" placeholder="Password" required class="login-form-field" required>
        <button type="submit" id="login-form-submit">Login</button>
</main>

</body>
</html>
